name: Test
on:
  pull_request:
    branches:
      - main
      - v1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm with runtime
        uses: pnpm/setup@v1

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Type check - cf-eventhub
        working-directory: cf-eventhub
        run: pnpm typecheck
      - name: Test - cf-eventhub
        working-directory: cf-eventhub
        run: pnpm test

      - name: Check generated Web Console styles
        working-directory: web-console
        run: pnpm check:styles
      - name: Type check - web-console
        working-directory: web-console
        run: pnpm typecheck
      - name: Test - web-console
        working-directory: web-console
        run: pnpm test
